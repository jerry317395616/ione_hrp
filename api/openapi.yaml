openapi: 3.1.0
info:
  title: 美妍伊人医院HRP API
  version: 3.0.0
  description: Frappe v16 based Hospital Resource Planning API contract.
servers:
- url: https://{host}
  variables:
    host:
      default: hrp.example.com
paths:
  /api/method/ione_hrp_core.api.v1.scope.resolve:
    post:
      operationId: core_001
      summary: 解析当前用户组织/数据权限
      tags:
      - ione_hrp
      security:
      - tokenAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '403':
          description: Forbidden
        '409':
          description: Conflict / duplicate request
        '422':
          description: Business validation error
        '500':
          description: Internal error
      x-required-role: Authenticated User
      x-transaction-boundary: Single DB transaction
      x-idempotency: Required for write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: user,doctype,action
              additionalProperties: true
  /api/method/ione_hrp_core.api.v1.approval.evaluate:
