components:
  headers:
    CorrelationId:
      description: Identifier propagated across related HTTP and background executions.
      schema:
        type: string
        pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
    RequestId:
      description: Unique identifier for this HTTP request or background execution.
      schema:
        type: string
        pattern: ^req-[A-Za-z0-9]{20}$
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: token api_key:api_secret or OAuth2 bearer
  schemas:
    FrappeResponse:
      type: object
      properties:
        message: {}
        correlation_id:
          type: string
        warnings:
          type: array
          items:
            type: string
    ModuleEnabledFrappeResponse:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: object
          additionalProperties: false
          required:
          - module
          - enabled
          - changed
          - correlation_id
          - request_id
          - idempotency_replayed
          properties:
            module:
              type: string
            enabled:
              type: boolean
            changed:
              type: boolean
            correlation_id:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
            request_id:
              type: string
              pattern: ^req-[A-Za-z0-9]{20}$
            idempotency_replayed:
              type: boolean
    AuditContextResponse:
      type: object
      required:
      - message
      properties:
        message:
          $ref: '#/components/schemas/AuditContext'
    ImmutableLedgerContractResponse:
      type: object
      required:
      - message
      properties:
        message:
          $ref: '#/components/schemas/ImmutableLedgerContract'
    TransactionalMessageContractResponse:
      type: object
      required:
      - message
      properties:
        message:
          $ref: '#/components/schemas/TransactionalMessageContract'
    IoneErrorResponse:
      type: object
      required:
      - ione_error
      properties:
        ione_error:
          $ref: '#/components/schemas/IoneError'
        exc_type:
          type: string
        exception:
          type: string
          description: Present only when the locked Frappe traceback policy permits it.
    IoneError:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - code
      - category
      - message
      - error_id
      - retryable
      - correlation_id
      - request_id
      properties:
        schema_version:
          type: integer
          const: 1
        code:
          type: string
          pattern: ^IONE-CORE-[0-9]{4}$
        category:
          type: string
          enum:
          - authentication
          - authorization
          - validation
          - not_found
          - conflict
          - policy
          - dependency
          - throttling
          - internal
        message:
          type: string
        error_id:
          type: string
        retryable:
          type: boolean
        correlation_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
        request_id:
          type: string
          pattern: ^req-[A-Za-z0-9]{20}$
    AuditContext:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - correlation_id
      - request_id
      - parent_request_id
      - channel
      - http_write_enabled
      properties:
        schema_version:
          type: integer
          const: 1
        correlation_id:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
        request_id:
          type: string
          pattern: ^req-[A-Za-z0-9]{20}$
        parent_request_id:
          oneOf:
          - type: string
            pattern: ^req-[A-Za-z0-9]{20}$
          - type: 'null'
        channel:
          type: string
          enum:
          - http
          - job
          - service
        http_write_enabled:
          type: boolean
          const: false
    ImmutableLedgerContract:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - base_fields
      - mutation_policy
      - reversal_policy
      - http_write_enabled
      properties:
        schema_version:
          type: integer
          const: 1
        base_fields:
          type: array
          minItems: 17
          items:
            type: object
            additionalProperties: false
            required:
            - fieldname
            - fieldtype
            - required
            properties:
              fieldname:
                type: string
              fieldtype:
                type: string
              required:
                type: boolean
        mutation_policy:
          type: object
          additionalProperties:
            type: boolean
        reversal_policy:
          type: object
          additionalProperties:
            type: boolean
        http_write_enabled:
          type: boolean
          const: false
    TransactionalMessageContract:
      type: object
      additionalProperties: false
      required:
      - schema_version
      - base_fields
      - statuses
      - delivery_semantics
      - mutation_policy
      - http_write_enabled
      properties:
        schema_version:
          type: integer
          const: 1
        base_fields:
          type: array
          minItems: 23
          items:
            type: object
            additionalProperties: false
            required:
            - fieldname
            - fieldtype
            - required
            properties:
              fieldname:
                type: string
              fieldtype:
                type: string
              required:
                type: boolean
        statuses:
          type: object
          additionalProperties: false
          required:
          - outbox
          - inbox
          properties:
            outbox:
              type: array
              items:
                type: string
                enum:
                - Pending
                - Processing
                - Delivered
                - Failed
                - Dead Letter
            inbox:
              type: array
              items:
                type: string
                enum:
                - Processing
                - Processed
                - Failed
                - Ignored
        delivery_semantics:
          type: object
          additionalProperties: true
          required:
          - outbox_delivery
          - inbox_deduplication
          - payload_integrity
          - claiming
          - external_calls_inside_transaction
          properties:
            outbox_delivery:
              type: string
              const: at_least_once
            inbox_deduplication:
              type: string
              const: consumer_and_event_id
            payload_integrity:
              type: string
              const: canonical_json_sha256
            claiming:
              type: string
              const: row_lock_nowait_and_lease
            external_calls_inside_transaction:
              type: boolean
              const: false
        mutation_policy:
          type: object
          additionalProperties:
            type: boolean
        http_write_enabled:
          type: boolean
          const: false
    Problem:
      type: object
      required:
      - code
      - message
      - correlation_id
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
        correlation_id:
          type: string
