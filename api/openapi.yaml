      operationId: por_002
      summary: 提交统一服务表单
      tags:
      - ione_hrp
      security:
      - tokenAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '403':
          description: Forbidden
        '409':
          description: Conflict / duplicate request
        '422':
          description: Business validation error
        '500':
          description: Internal error
      x-required-role: Authenticated User
      x-transaction-boundary: Single DB transaction
      x-idempotency: Required for write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: service_form,payload,attachments
              additionalProperties: true
components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: token api_key:api_secret or OAuth2 bearer
  schemas:
    FrappeResponse:
      type: object
      properties:
        message: {}
        correlation_id:
          type: string
        warnings:
          type: array
          items:
            type: string
    Problem:
      type: object
      required:
      - code
      - message
      - correlation_id
      properties:
        code:
          type: string
        message:
          type: string
        details: {}
        correlation_id:
          type: string
