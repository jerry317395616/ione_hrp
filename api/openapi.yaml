openapi: 3.1.0
info:
  title: 美妍伊人医院HRP API
  version: 3.0.0
  description: Frappe v17 based Hospital Resource Planning API contract.
servers:
- url: https://{host}
  variables:
    host:
      default: hrp.example.com
paths:
  /api/method/ione_hrp.api.v1.environment.get_environment_status:
    get:
      operationId: platform_010
      summary: 查询当前非生产环境安全配置
      tags:
      - ione_hrp
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Environment profile status without secrets or server paths
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '401':
          description: Authentication required
        '500':
          description: Environment configuration invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: Authenticated User
      x-transaction-boundary: Read-only
      x-idempotency: Not applicable
  /api/method/ione_hrp.api.v1.fixtures.get_fixture_governance_status:
    get:
      operationId: platform_011
      summary: 查询 Fixtures 导出治理状态
      tags:
      - ione_hrp
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Redacted fixture policy and repository status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '401':
          description: Authentication required
        '403':
          description: System Manager role required
        '500':
          description: Fixture policy or repository validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Not applicable
  /api/method/ione_hrp.api.v1.change_governance.get_change_governance_status:
    get:
      operationId: platform_012
      summary: 查询 ADR 与变更治理状态
      tags:
      - ione_hrp
      security:
      - tokenAuth: []
      parameters:
      - name: correlation_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 140
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          maxLength: 140
      responses:
        '200':
          description: Redacted deterministic ADR and change-governance status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '401':
          description: Authentication required
        '403':
          description: System Manager or HRP System Manager role required
        '400':
          description: Invalid correlation identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: ADR, change record or repository governance validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/ione_hrp.api.v1.errors.get_error_catalog:
    get:
      operationId: platform_013
      summary: 查询统一错误码目录
      tags:
      - ione_hrp
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Stable translated I-ONE error catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Error catalog or translations are invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/ione_hrp.api.v1.audit.get_audit_context:
    get:
      operationId: platform_014
      summary: 查询当前请求的审计上下文
      tags:
      - ione_hrp
      security:
      - tokenAuth: []
      parameters:
      - name: X-Correlation-ID
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 140
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/-]{0,139}$
      responses:
        '200':
          description: Safe request-scoped identifiers without actor or request payload
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditContextResponse'
        '400':
          description: Invalid correlation identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: Authenticated User
      x-transaction-boundary: Read-only
      x-idempotency: Read-only per request
  /api/method/ione_hrp.api.v1.ledgers.get_immutable_ledger_contract:
    get:
      operationId: platform_015
      summary: 查询不可变台账公共契约
      tags:
      - ione_hrp
      security:
      - tokenAuth: []
      responses:
        '200':
          description: Shared append-only and equal-and-opposite reversal contract
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImmutableLedgerContractResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '403':
          description: System Manager or HRP System Manager role required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
        '500':
          description: Immutable ledger platform contract is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IoneErrorResponse'
      x-required-role: System Manager or HRP System Manager
      x-transaction-boundary: Read-only
      x-idempotency: Read-only deterministic
  /api/method/ione_hrp.api.v1.messages.get_transactional_message_contract:
