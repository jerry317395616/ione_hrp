name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned quality dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          npm ci
      - name: Run repository, unit, type and frontend checks
        run: python scripts/quality.py
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  integration:
    name: Integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client libmariadb-dev pkg-config redis-server
      - name: Build locked Bench and run ione_hrp tests
        env:
          ADMIN_PASSWORD: ci_admin_password
          BENCH_DIR: ${{ runner.temp }}/frappe-bench
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_ROOT_PASSWORD: ci_root_password
          DB_ROOT_USERNAME: root
          PYTHON_BIN: python3.14
          SITE_NAME: test_site
        run: bash scripts/ci_integration.sh
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/frappe-bench/logs
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required
    if: always()
    needs:
      - quality
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required job results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {
              "quality": os.environ["QUALITY_RESULT"],
              "integration": os.environ["INTEGRATION_RESULT"],
          }
          print(json.dumps(results, sort_keys=True))
          if any(result != "success" for result in results.values()):
              sys.exit(1)
          PY
