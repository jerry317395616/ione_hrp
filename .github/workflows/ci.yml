name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  K6_VERSION: "2.1.0"
  K6_LINUX_AMD64_SHA256: "295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned quality dependencies
        run: |
          python -m pip install --disable-pip-version-check -e ".[dev]"
          npm ci
      - name: Run repository, unit, type and frontend checks
        run: python scripts/quality.py
      - name: Validate pinned k6 performance script
        run: |
          archive="$RUNNER_TEMP/k6-v${K6_VERSION}-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/k6-v${K6_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$K6_LINUX_AMD64_SHA256" "$archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/k6-v${K6_VERSION}-linux-amd64/k6" version \
            | grep --fixed-strings "v${K6_VERSION}"
          "$RUNNER_TEMP/k6-v${K6_VERSION}-linux-amd64/k6" inspect \
            ione_hrp/load_tests/performance_baseline.js
      - name: Validate governed Git change
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [[ -n "$CHANGE_BASE" && ! "$CHANGE_BASE" =~ ^0+$ ]]; then
            python scripts/change_manager.py check \
              --base-ref "$CHANGE_BASE" \
              --correlation-id "CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            python scripts/change_manager.py validate
          fi
      - name: Audit Node dependencies
        run: npm audit --audit-level=high
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@bcfb9cce635345aac9996cedc19b2de8e01b894f # master
        env:
          GITHUB_TOKEN: ${{ github.token }}

  integration:
    name: Integration
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=12
          --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes mariadb-client libmariadb-dev pkg-config redis-server
      - name: Build locked Bench and run ione_hrp tests
        env:
          ADMIN_PASSWORD: ci_admin_password
          BENCH_DIR: ${{ runner.temp }}/frappe-bench
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_ROOT_PASSWORD: ci_root_password
          DB_ROOT_USERNAME: root
          PYTHON_BIN: python3.14
          SITE_NAME: hrp-test.localhost
        run: bash scripts/ci_integration.sh
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: integration-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/frappe-bench/logs
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required
    if: always()
    needs:
      - quality
      - integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Enforce required job results
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          results = {
              "quality": os.environ["QUALITY_RESULT"],
              "integration": os.environ["INTEGRATION_RESULT"],
          }
          print(json.dumps(results, sort_keys=True))
          if any(result != "success" for result in results.values()):
              sys.exit(1)
          PY
